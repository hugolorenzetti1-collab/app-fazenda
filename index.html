<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fazenda Lorenzetti</title>
<meta name="theme-color" content="#1F3D2B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--verde:#1F3D2B;--verde2:#2E5A3F;--laranja:#CF6B33;--laranja2:#E8761A;--fundo:#F4F2EC;--card:#fff;--txt:#1d241f;--cinza:#6b7268;--borda:#d9d6cc;--vermelho:#B3261E;--ok:#2E7D4F;--azul:#2f6fb3;--rosa:#d45a93}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo);color:var(--txt);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:1000;background:var(--verde);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:3px solid var(--laranja)}
header .tit{font-weight:800;letter-spacing:.08em;font-size:15px;flex:1}
header .tit b{color:var(--laranja)}
header img{width:40px;height:40px;border-radius:50%}
header .voltar{background:none;border:0;color:#fff;font-size:28px;padding:0 6px 0 0;cursor:pointer;display:none;line-height:1}
main{padding:14px 16px 110px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:14px;margin-bottom:12px}
.linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--verde);background:#fff;color:var(--verde);border-radius:10px;padding:11px 16px;font-size:16px;font-weight:600;cursor:pointer}
.btn.prim{background:var(--verde);color:#fff}
.btn.lar{background:var(--laranja);border-color:var(--laranja);color:#fff}
.btn.vm{border-color:var(--vermelho);color:var(--vermelho)}
.btn.peq{padding:6px 10px;font-size:14px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:2px solid var(--verde);border-radius:14px;background:#fff;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;color:var(--txt);cursor:pointer;padding:10px;text-align:center}
.tile svg{width:30px;height:30px;stroke:var(--verde);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile:active{background:#eef3ee}
label{display:block;font-size:13px;color:var(--cinza);margin:10px 0 4px}
input,select,textarea{width:100%;font-size:17px;padding:11px 12px;border:1px solid var(--borda);border-radius:10px;background:#fff;color:var(--txt)}
input[type=checkbox]{width:22px;height:22px}
.seg{display:flex;border:2px solid var(--verde);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px 6px;font-size:15px;font-weight:600;color:var(--verde);cursor:pointer}
.seg button.on{background:var(--verde);color:#fff}
.abas{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.abas button{flex:0 0 auto;border:0;border-radius:20px;background:#e6e3d9;padding:9px 14px;font-size:15px;font-weight:600;color:var(--txt);cursor:pointer}
.abas button.on{background:var(--verde);color:#fff}
h2{font-size:19px;margin:4px 0 12px}
h3{font-size:15px;margin:0 0 8px;color:var(--verde)}
.sec{font-weight:700;color:var(--verde);margin:16px 0 8px;font-size:15px}
.muted{color:var(--cinza);font-size:14px}
.tag{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.t-ok{background:#E3F1E7;color:var(--ok)}.t-am{background:#FBF0D3;color:#8a5d00}.t-vm{background:#F9E1DF;color:var(--vermelho)}.t-cz{background:#ECECE8;color:#555}.t-az{background:#E2ECF7;color:var(--azul)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
th{color:var(--cinza);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
.rolar{overflow-x:auto;margin:0 -14px;padding:0 14px}
.rolar table{min-width:760px;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:10px;z-index:3000;max-width:90%;font-size:15px;display:none}
#mapa{height:calc(100vh - 160px);border-radius:12px;border:1px solid var(--borda)}
.leaflet-tooltip.rot{background:none;border:0;box-shadow:none;color:#fff;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000;font-size:11px;padding:0}
.leaflet-tooltip.rot:before{display:none}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpi{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:10px}
.kpi span{display:block;font-size:11px;color:var(--cinza);text-transform:uppercase;letter-spacing:.02em}
.kpi b{display:block;font-size:21px;margin-top:2px}
.kpi b i{font-style:normal}
.kpi.c{text-align:center}
.x{border:0;background:#eee;border-radius:8px;height:44px;min-width:44px;font-size:20px;cursor:pointer}
.status{font-size:13px;color:var(--cinza);margin-top:8px}
.barra{position:fixed;left:0;right:0;bottom:0;background:var(--verde);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:1500;text-align:center}
.barra .muted{color:#dfe8df;font-size:13px;margin-bottom:6px}
.barra .btn{width:100%;max-width:648px;background:#16a34a;border-color:#16a34a;color:#fff}
.avisos{background:#F9E1DF;border:1px solid #efb6b0;color:var(--vermelho);border-radius:12px;padding:10px 14px;margin-bottom:12px;cursor:pointer}
.avisos b{display:block;margin-bottom:4px}
.avisos div{font-size:14px;color:#7a1d17}
.pastorow{display:grid;grid-template-columns:70px 1fr 90px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
.pastorow b{color:var(--laranja);font-size:17px}
.mod{border-radius:12px;overflow:hidden;margin-bottom:10px;border:1px solid #e3a46d}
.mod .hd{background:var(--laranja2);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;cursor:pointer}
.mod .hd div{flex:1}
.mod .hd small{display:block;font-size:12px;opacity:.9}
.mod .bd{background:#fff;padding:12px 14px}
.chip{background:#fff;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700}
.chip.acima{color:var(--vermelho)}.chip.aumentar{color:#a86a00}.chip.ok{color:var(--ok)}.chip.semlote{color:#777}
.pcard{border:1px solid var(--borda);border-radius:10px;padding:10px;margin-bottom:8px}
.pcard.atrasado{border-color:#e5a29c;background:#fff6f5}
.pcard.atual{border-color:#9cc9ab;background:#f5fbf6}
.lrow{display:grid;grid-template-columns:1fr 72px 80px 40px;gap:6px;margin-bottom:6px}
.lrow input{padding:9px 8px;font-size:15px}
.oculto{display:none!important}
</style>
</head>
<body>
<header>
  <button class="voltar" id="btVoltar" onclick="ir('home')">‹</button>
  <div class="tit">FAZENDA <b>LORENZETTI</b></div>
  <img src="icon-192.png" alt="">
</header>
<main id="app"></main>
<div id="barra"></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ======= configuração ======= */
const API = 'https://script.google.com/macros/s/AKfycbwY3RA38GPBgCJ4UZjjwriIR1XyGTsPuZ1mBAuUJ_TNuZuF4nQg7P_q68GT8okeYCZd/exec';
const VERSAO = '2.4';

/* ======= estado ======= */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('fl_'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('fl_'+k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
let user = LS.get('user', null);
let fila = LS.get('fila', []);
let dados = LS.get('dados2', null);
let fazenda = LS.get('fazenda', 'Lorenzetti');
let enviando = false;

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoDe = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hojeISO = () => isoDe(new Date());
const br = iso => { if(!iso) return '—'; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso); return m? m[3]+'/'+m[2]+'/'+m[1] : iso; };
const parseISO = iso => { const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||''); return m? new Date(+m[1],m[2]-1,+m[3]) : null; };
const diasEntre = (a,b) => { const x=parseISO(a), y=parseISO(b); return x&&y ? Math.round((y-x)/864e5) : null; };
const diasDesde = iso => diasEntre(iso, hojeISO());
const somaDias = (iso,n) => { const d=parseISO(iso); d.setDate(d.getDate()+n); return isoDe(d); };
const fmt = (n,dec) => (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:dec==null?0:dec, minimumFractionDigits:dec||0});
const norm = s => String(s||'').toUpperCase().replace(/PASTO/g,'').replace(/[\s\-]/g,'').trim();
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function toast(msg, ms){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms||2600); }

/* ======= ícones ======= */
const IC = {
  trato:'<svg viewBox="0 0 24 24"><path d="M3 10h18l-2 9H5z"/><path d="M7 10V6h10v4"/></svg>',
  rot:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>',
  gado:'<svg viewBox="0 0 24 24"><path d="M4 9c0-2 2-3 4-3h8c2 0 4 1 4 3v3c0 2-2 4-4 4H8c-2 0-4-2-4-4z"/><path d="M7 16v3M17 16v3M3 7l2 1M21 7l-2 1"/></svg>',
  chuva:'<svg viewBox="0 0 24 24"><path d="M7 16a4 4 0 0 1-.6-8A6 6 0 0 1 18 8.5a3.8 3.8 0 0 1-.5 7.5"/><path d="M13 12l-3 5h4l-3 5"/></svg>',
  morte:'<svg viewBox="0 0 24 24"><path d="M12 3v18M7 8h10"/></svg>',
  contagem:'<svg viewBox="0 0 24 24"><path d="M9 4 7 20M17 4l-2 16M4 9h17M3 15h17"/></svg>',
  bebedouro:'<svg viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>',
  cocho:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M12 5v14"/><path d="M4 12h8"/></svg>',
  maquina:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>',
  mapa:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><path d="M4 9h16M4 14h16M9 4v16M14 4v16"/></svg>',
  painel:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
};

/* ======= navegação ======= */
let tela = 'home';
function ir(t, arg){ if(user && user.ver && !['home','login','painel','mapa'].includes(t)){ t='painel'; arg=undefined; } tela=t; $('#barra').innerHTML=''; $('#btVoltar').style.display = (t==='home'||t==='login')?'none':'block'; window.scrollTo(0,0); (TELAS[t]||TELAS.home)(arg); if(t!=='home') history.pushState({t},''); }
window.addEventListener('popstate', ()=>{ if(tela!=='home' && tela!=='login') ir('home'); });

/* ======= API ======= */
async function api(body){
  const r = await fetch(API, {method:'POST', body: JSON.stringify(Object.assign({u:user&&user.u, p:user&&user.p}, body))});
  const j = await r.json();
  if(!j.ok) throw new Error(j.erro||'Erro no servidor');
  return j;
}

async function sincronizar(silencioso){
  if(enviando) return;
  if(!navigator.onLine){ if(!silencioso) toast('Sem internet. Os lançamentos ficam na fila.'); return; }
  enviando = true; render();
  try{
    const tentados = new Set(); let enviados = 0, comErro = 0;
    while(true){
      const lote = fila.filter(x => !tentados.has(x.id)).slice(0, 15);
      if(!lote.length) break;
      lote.forEach(x => tentados.add(x.id));
      const j = await api({a:'sync', itens: lote});
      const ok = new Set(j.gravados||[]);
      const m = {}; (j.erros||[]).forEach(e => m[e.id] = e.erro);
      fila = fila.filter(x => !ok.has(x.id));
      fila.forEach(x => { if(m[x.id]) x.erro = m[x.id]; });
      LS.set('fila', fila);
      enviados += ok.size; comErro += Object.keys(m).length;
    }
    if(comErro) toast(comErro+' lançamento(s) deram erro. Veja a fila.', 4000);
    else if(enviados && !silencioso) toast(enviados+' lançamento(s) enviados ✔');
    const d = await api({a:'dados'});
    dados = d.dados; aplicaFila(); salvaDados(); LS.set('dadosEm', new Date().toISOString());
    if(!silencioso && !enviados && !comErro) toast('Dados atualizados ✔');
  }catch(e){
    if(!silencioso) toast('Não sincronizou: '+e.message, 4000);
  }finally{ enviando=false; render(); }
}
function salvaDados(){ if(!LS.set('dados2', dados)) toast('Celular sem espaço para guardar os dados', 4000); }

/* aplica no pacote local o que ainda está na fila, para as telas já mostrarem */
const APLICA = {};
function aplicaFila(){ if(!dados) return; fila.forEach(x => { try{ APLICA[x.tipo] && APLICA[x.tipo](dados, x.d); }catch(e){} }); }
function lancar(tipo, d){
  if(user && user.ver){ toast('Usuário só de consulta'); return null; }
  const it = {id: uid(), tipo, d, ts: new Date().toISOString(), user: user.nome};
  fila.push(it);
  if(!LS.set('fila', fila)){ fila.pop(); if(d.foto){ delete d.foto; fila.push(it); LS.set('fila', fila); toast('Sem espaço para a foto — lançamento salvo sem foto', 4500); } else { toast('Celular sem espaço!', 4000); return null; } }
  if(dados && APLICA[tipo]){ try{ APLICA[tipo](dados, d); salvaDados(); }catch(e){} }
  return it;
}
function salvo(n, volta){ toast((n>1? n+' lançamentos salvos':'Lançamento salvo')+(navigator.onLine?' — enviando…':' na fila (sem internet)')); if(volta!==false) ir(volta||'home'); if(navigator.onLine) sincronizar(true); }

APLICA.gado = (D,d) => { const m=+d.machos||0, f=+d.femeas||0; D.gado.lanc.push(d.mov==='saida'? [d.data,0,0,m,f,(d.obs||'').toUpperCase(),d.fazenda] : [d.data,m,f,0,0,(d.obs||'').toUpperCase(),d.fazenda]); };
APLICA.transf = (D,d) => { const m=+d.machos||0, f=+d.femeas||0; D.gado.lanc.push([d.data,0,0,m,f,'TRANSF. P/ '+d.para.toUpperCase(),d.de]); D.gado.lanc.push([d.data,m,f,0,0,'TRANSF. DA '+d.de.toUpperCase(),d.para]); };
APLICA.morte = (D,d) => { const q=+d.qtd||1; D.gado.lanc.push([d.data,0,0,d.sexo==='F'?0:q,d.sexo==='F'?q:0,'MORTE '+(d.causa||'').toUpperCase(),d.fazenda]); };
APLICA.trato = (D,d) => { const k=d.pasto.toUpperCase(); const u=D.semi.ultTrato[k]; if(!u||u.data<=d.data) D.semi.ultTrato[k]={data:d.data,kg:+d.kg}; D.semi.recentes.unshift({data:d.data,pasto:k,kg:+d.kg,quem:d.tratador}); };
APLICA.chuva = (D,d) => { D.chuva.push([d.data,+d.mm]); D.chuva.sort((a,b)=>a[0]<b[0]?-1:1); };
APLICA.manejo = (D,d) => { const m=String(d.modulo); if(d.datas){ Object.keys(D.rot.datas).forEach(k=>{ if(k.split('||')[0]===m) delete D.rot.datas[k]; }); Object.keys(d.datas).forEach(p=>{ if(d.datas[p]) D.rot.datas[m+'||'+p]=d.datas[p]; }); } if(d.lotes) D.rot.lotes[m]=d.lotes.map(l=>({categoria:l.categoria,cabecas:+l.cabecas||0,peso:+l.peso||0})); };
APLICA.contagem = (D,d) => D.contagens.unshift({data:d.data,local:d.local,cab:+d.cabecas,faz:d.fazenda});
APLICA.bebedouro = (D,d) => { const u=D.bebedouros[d.local]; if(!u||u.data<=d.data) D.bebedouros[d.local]={data:d.data,obs:d.obs}; D.bebHist.unshift({data:d.data,local:d.local,user:user.nome}); };
APLICA.cocho = (D,d) => { D.ultCocho[d.modulo]={data:d.data,produto:d.produto,sacos:+d.sacos,kg:+d.kg}; D.cochoHist.unshift({data:d.data,modulo:d.modulo,pasto:d.pasto,produto:d.produto,sacos:+d.sacos,kg:+d.kg}); };
APLICA.maquina = (D,d) => D.maqHist.unshift({data:d.data,maquina:d.maquina,tipo:d.tipo,horimetro:+d.horimetro,litros:+d.litros,desc:d.desc,user:user.nome});
APLICA.maq_nova = (D,d) => { if(!D.maquinas.find(m=>m.nome.toUpperCase()===d.nome.toUpperCase())) D.maquinas.push({nome:d.nome,tipo:d.tipo}); };
APLICA.regras = (D,d) => { Object.keys(d.regras).forEach(k=>{ if(D.regras[k]) Object.assign(D.regras[k], d.regras[k]); }); };

/* ======= helpers ======= */
const campoData = (id, v) => `<label>Data</label><input type="date" id="${id||'fData'}" value="${v||hojeISO()}">`;
function seg(id, opcoes, ativo, onchg){ return `<div class="seg" id="${id}" data-v="${esc(ativo)}" data-chg="${onchg||''}">`+opcoes.map(o=>`<button type="button" data-v="${esc(o[0])}" class="${o[0]===ativo?'on':''}" onclick="segClick(this)">${esc(o[1])}</button>`).join('')+'</div>'; }
function segClick(b){ const p=b.parentNode; p.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); p.dataset.v=b.dataset.v; if(p.dataset.chg) window[p.dataset.chg](b.dataset.v); }
const val = id => { const e=document.getElementById(id); if(!e) return ''; return e.classList.contains('seg') ? e.dataset.v : e.value.trim(); };
const FAZENDAS = ['Lorenzetti','União'];
function opts(lista, sel){ return lista.map(v=> Array.isArray(v) ? `<option value="${esc(v[0])}" ${String(v[0])===String(sel)?'selected':''}>${esc(v[1])}</option>` : `<option ${v==sel?'selected':''}>${esc(v)}</option>`).join(''); }
function abas(id, lista, ativo, fn){ return `<div class="abas" id="${id}">`+lista.map(a=>`<button class="${a[0]===ativo?'on':''}" onclick="${fn}('${a[0]}')">${a[1]}</button>`).join('')+'</div>'; }
function kpi(rot, v, cls){ return `<div class="kpi ${cls||''}"><span>${rot}</span><b>${v}</b></div>`; }
function semDados(){ return dados ? '' : `<div class="card t-am">Ainda não baixou os dados da fazenda. Conecte na internet e toque em <b>Sincronizar</b> uma vez.</div>`; }
const modulos = () => dados ? dados.rot.modulos : [];
function locaisTodos(){
  const l = dados ? dados.semi.pastos.filter(p=>p.bois).map(p=>'Pasto '+p.pasto) : [];
  modulos().forEach(m=>l.push('Módulo '+m.n));
  l.push('Curral','Sede','Outro');
  return l;
}

/* ======= gado: saldos ======= */
const ehHist = f => /hist/i.test(f||'');
function linhasGado(faz){ return (dados?dados.gado.lanc:[]).filter(r => !ehHist(r[6]) && (faz==='As duas' || (r[6]||'Lorenzetti')===faz)); }
function saldoGado(faz){ let m=0,f=0; linhasGado(faz).forEach(r=>{ m+=r[1]-r[3]; f+=r[2]-r[4]; }); return {m,f}; }

/* ======= rotacionado (mesma conta do app antigo) ======= */
function capMedida(mod){ const med=dados.rot.med; if(!med) return null; let cap=0,n=0,data=''; mod.pastos.forEach(p=>{ const x=med.ult[mod.n+'||'+p[0]]; if(x){ cap+=x.cap; n++; if(x.data>data) data=x.data; } }); return n?{cap,n,data}:null; }
function calcModulo(mod0, datas, lotes){
  const cm = capMedida(mod0); const mod = Object.assign({}, mod0, {cap: cm? cm.cap : mod0.cap});
  const H = hojeISO(), UA = dados.rot.uaKg || 450;
  const lote = lotes[String(mod.n)] || [];
  let ua=0, cab=0, somaPeso=0;
  lote.forEach(l=>{ const c=+l.cabecas||0, p=+l.peso||0; ua+=c*p/UA; cab+=c; somaPeso+=c*p; });
  const pesoMedio = cab>0 ? somaPeso/cab : 280, cabPorUA = pesoMedio/UA;
  let status='semlote';
  if(cab>0) status = ua > mod.cap+0.5 ? 'acima' : (ua < mod.cap*0.85 ? 'aumentar' : 'ok');
  const difUA = mod.cap-ua, difCab = cabPorUA>0 ? Math.round(difUA/cabPorUA) : 0;
  const ps = mod.pastos.map(p=>({nome:p[0], dias:p[1], entrada:'', saida:'', salva:false}));
  let prevT = null;
  for(let i=0;i<ps.length;i++){
    const k = mod.n+'||'+ps[i].nome; let ent = datas[k]||'';
    ps[i].salva = !!datas[k];
    const entT = ent ? parseISO(ent).getTime() : (i>0 ? prevT : null), saiT = entT!=null ? entT + ps[i].dias*864e5 : null;
    ps[i].entrada = entT!=null ? isoDe(new Date(entT)) : ''; ps[i].saida = saiT!=null ? isoDe(new Date(saiT)) : ''; prevT = saiT;
  }
  let at=-1; ps.forEach((p,j)=>{ if(p.entrada && p.entrada<=H) at=j; });
  ps.forEach((p,idx)=>{ p.estado=''; if(!p.entrada){ p.estado = idx>at?'prox':''; return; } if(idx<at) p.estado='feito'; else if(idx===at) p.estado = H>p.saida?'atrasado':'atual'; else p.estado='prox'; });
  const atrasado = at>=0 && H>ps[at].saida;
  return {cap: mod.cap, capMed: cm, ua, cab, status, difCab, pastos:ps, atrasado, diasAtraso: atrasado? diasEntre(ps[at].saida,H):0, pastoAtual: at>=0?ps[at]:null};
}

function rotData(n, pasto, v){ const k=n+'||'+pasto; if(v) ROT.datas[k]=v; else delete ROT.datas[k]; rotMudou.add(n); rotManejo(); }
function rotLote(n, i, campo, v){ const k=String(n); const l = ROT.lotes[k] = ROT.lotes[k] || [];
  if(campo==='add') l.push({categoria:'',cabecas:0,peso:0}); else if(campo==='x') l.splice(i,1); else l[i][campo] = campo==='categoria'? v : (+v||0);
  rotMudou.add(n); rotManejo(); }
function rotSalvar(){
  let n=0;
  rotMudou.forEach(m=>{
    const datas={}; Object.keys(ROT.datas).forEach(k=>{ const p=k.split('||'); if(p[0]===String(m)) datas[p[1]]=ROT.datas[k]; });
    modulos().find(x=>x.n==m).pastos.forEach(p=>{ if(!(p[0] in datas)) datas[p[0]]=''; });
    const lotes=(ROT.lotes[String(m)]||[]).filter(l=>l.categoria||l.cabecas);
    lancar('manejo',{modulo:m, datas, lotes}); n++;
  });
  rotMudou=new Set(); ROT=null;
  toast(n+' módulo(s) salvo(s)'+(navigator.onLine?' — enviando…':' na fila'));

}

  const ms = modulos(); if(!forMod) forMod = (ms.find(m=>(dados.rot.lotes[String(m.n)]||[]).length)||ms[0]).n;

  let h = `<div class="card"><label>Módulo</label><select onchange="forMod=this.value;rotForragem()">${opts(ms.map(x=>[x.n,'Módulo '+x.n]), m.n)}</select>

function graficoGado(){
  const rows = linhasGado(filtroFaz); if(!rows.length) return '';
  const meses = {}; let m=0,f=0;
  rows.slice().sort((a,b)=>a[0]<b[0]?-1:1).forEach(r=>{ m+=r[1]-r[3]; f+=r[2]-r[4]; meses[r[0].slice(0,7)]=[m,f]; });
  const ks=[]; let d=new Date(2020,0,1); const fim=hojeISO().slice(0,7); let last=[0,0];
  while(isoDe(d).slice(0,7)<=fim){ const k=isoDe(d).slice(0,7); if(meses[k]) last=meses[k]; else { const prev=Object.keys(meses).filter(x=>x<k).pop(); if(prev) last=meses[prev]; } ks.push([k,last[0],last[1]]); d.setMonth(d.getMonth()+1); }
  const W=640,H=240,L=56,B=24,T=8,R=8; const mx=Math.max(...ks.map(x=>Math.max(x[1],x[2])),1);
  const step=Math.pow(10,Math.floor(Math.log10(mx))); const top=Math.ceil(mx/step)*step;

  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
  for(let i=0;i<=4;i++){ const v=top*i/4; s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eadfcd"/><text x="${L-6}" y="${Y(v)+4}" font-size="14" text-anchor="end" fill="#777">${fmt(v)}</text>`; }
  ks.forEach((k,i)=>{ if(k[0].endsWith('-01')) s+=`<text x="${X(i)}" y="${H-6}" font-size="14" text-anchor="middle" fill="#777">${k[0].slice(0,4)}</text>`; });
  const path=j=>ks.map((k,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(k[j]).toFixed(1)).join(' ');
  s+=`<path d="${path(1)}" fill="none" stroke="#2f6fb3" stroke-width="2"/><path d="${path(2)}" fill="none" stroke="#d45a93" stroke-width="2"/></svg>`;
  return `<div class="muted" style="font-size:12px"><span style="color:var(--azul)">●</span> Machos <span style="color:var(--rosa)">●</span> Fêmeas</div>`+s;
}

function resumo(x){ const d=x.d||{}; const mf=()=>[(+d.machos?d.machos+' M':''),(+d.femeas?d.femeas+' F':''),(d.qtd&&!d.machos&&!d.femeas?d.qtd+(d.sexo==='F'?' F':' M'):'')].filter(Boolean).join(' '); switch(x.tipo){

  case 'gado': return (d.mov==='saida'?'Saída ':'Entrada ')+mf()+' · '+d.fazenda+(d.obs?' · '+d.obs:'');
  case 'transf': return mf()+' · '+d.de+' → '+d.para;

  case 'chuva': return d.mm+' mm';

  <div class="card" style="margin-top:12px"><h3>Gado por fazenda</h3><table><tr><th>Fazenda</th><th class="n">Machos</th><th class="n">Fêmeas</th><th class="n">Total</th></tr>
    <tr><td>Lorenzetti</td><td class="n">${fmt(sL.m)}</td><td class="n">${fmt(sL.f)}</td><td class="n"><b>${fmt(sL.m+sL.f)}</b></td></tr>
    <tr><td>União</td><td class="n">${fmt(sU.m)}</td><td class="n">${fmt(sU.f)}</td><td class="n"><b>${fmt(sU.m+sU.f)}</b></td></tr></table></div>
  <div class="card"><h3>Avisos (${av.length})</h3>${av.map(a=>`<div style="padding:6px 0;border-bottom:1px solid #eee;color:var(--vermelho)">• ${esc(a.t)}</div>`).join('')||'<span class="muted">Nenhum aviso. 🟢</span>'}</div>
  <p class="muted">Dados de ${new Date(LS.get('dadosEm',dados.gerado)).toLocaleString('pt-BR')}. Toque nas abas acima para ver cada área.</p>`;
}

  const C=$('#gadoC'); const s=saldoGado(filtroFaz);

   <div class="sec">Evolução do rebanho</div><div class="card">${graficoGado()}</div>

}

/* =================== MAPA =================== */
let MAPA=null, GEO=null;
TELAS.mapa = async () => {
  app.innerHTML = `<div class="linha" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Mapa</h2><button class="btn peq" onclick="baixarMapa()">Baixar mapa offline</button></div><div id="mapa"></div>
   <div class="muted" style="margin-top:6px"><span class="tag" style="background:#CF6B33;color:#fff">semi</span> <span class="tag" style="background:#2E7D4F;color:#fff">rotacionado com gado</span> <span class="tag" style="background:#cfd8cc">vazio</span></div>`;
  if(!GEO){ try{ GEO = await (await fetch('pastos.json')).json(); }catch(e){ app.insertAdjacentHTML('beforeend','<div class="card t-vm">Mapa não carregou.</div>'); return; } }
  if(MAPA){ MAPA.remove(); MAPA=null; }
  MAPA = L.map('mapa',{zoomControl:true, attributionControl:false});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18}).addTo(MAPA);
  const semi = {}; (dados?dados.semi.pastos:[]).forEach(p=>semi[norm(p.pasto)]=p);
  const atual = {}; if(dados) modulos().forEach(m=>{ const c=calcModulo(m,dados.rot.datas,dados.rot.lotes); if(c.pastoAtual && c.cab) atual[norm(c.pastoAtual.nome)]={m,c}; });
  const lay = L.geoJSON(GEO, {
    style: f => { const p=f.properties;
      if(p.k==='b') return {color:'#fff',weight:2,fill:false};
      if(p.k==='m') return {color:'#2f7d3a',weight:1,fillColor:'#1f5e2a',fillOpacity:.35};
      const s=semi[norm(p.nome)], r=atual[norm(p.pl)];
      if(s && s.bois) return {color:'#fff',weight:1.5,fillColor:'#CF6B33',fillOpacity:.65};
      if(r) return {color:'#fff',weight:1.5,fillColor:'#2E7D4F',fillOpacity:.7};
      return {color:'#fff',weight:1,fillColor:'#cfd8cc',fillOpacity:.25}; },
    onEachFeature: (f,l) => { const p=f.properties; if(p.k!=='p') return;
      const s=semi[norm(p.nome)], r=atual[norm(p.pl)];
      let h=`<b>Pasto ${esc(p.nome)}</b><br>${p.ha?esc(p.ha)+' ha':''}${p.rot?' · rotacionado módulo '+esc(p.rot):''}`;
      if(s){ const u=dados.semi.ultTrato[s.pasto]; h+=`<br>${s.bois} bois · ${s.peso} kg · entrada ${br(s.entrada)}<br>Último trato: ${u?br(u.data)+' ('+fmt(u.kg)+' kg)':'—'}`; }
      if(r){ h+=`<br><b>Gado aqui desde ${br(r.c.pastoAtual.entrada)}</b> (sai ${br(r.c.pastoAtual.saida)})<br>${(dados.rot.lotes[String(r.m.n)]||[]).map(x=>x.cabecas+' '+esc(x.categoria)).join(', ')}`; }
      l.bindPopup(h); l.bindTooltip(p.nome,{permanent:true,direction:'center',className:'rot'}); }
  }).addTo(MAPA);
  MAPA.fitBounds(lay.getBounds());
  const rotulos = () => { const on = MAPA.getZoom() >= 15; lay.eachLayer(l => { if(l.getTooltip()){ on ? l.openTooltip() : l.closeTooltip(); } }); };
  MAPA.on('zoomend', rotulos); rotulos();
  if('geolocation' in navigator){ navigator.geolocation.getCurrentPosition(pos=>{ L.circleMarker([pos.coords.latitude,pos.coords.longitude],{radius:7,color:'#fff',weight:2,fillColor:'#1a73e8',fillOpacity:1}).addTo(MAPA).bindPopup('Você está aqui'); },()=>{}, {enableHighAccuracy:true,timeout:8000}); }
};
async function baixarMapa(){
  if(!navigator.onLine) return toast('Precisa de internet para baixar');
  if(!GEO) return;
  const b = L.geoJSON(GEO).getBounds(); const urls=[];
  const t = (lat,lon,z)=>{ const n=2**z; const x=Math.floor((lon+180)/360*n); const r=lat*Math.PI/180; const y=Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n); return [x,y]; };
  for(let z=12; z<=16; z++){ const [x0,y0]=t(b.getNorth(),b.getWest(),z), [x1,y1]=t(b.getSouth(),b.getEast(),z);
    for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) urls.push(`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`); }
  toast('Baixando '+urls.length+' pedaços do mapa…', 4000);
  const c = await caches.open('fl-tiles'); let ok=0;
  for(let i=0;i<urls.length;i+=8){ await Promise.all(urls.slice(i,i+8).map(u=>fetch(u,{mode:'cors'}).then(r=>{ if(r.ok){ ok++; return c.put(u,r); } }).catch(()=>{}))); }
  toast('Mapa offline pronto ('+ok+' pedaços) ✔', 3500);
}
